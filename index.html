<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tempo Tap</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#111;color:#eee;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;user-select:none;-webkit-user-select:none}
  .bpm{font-size:clamp(4rem,15vw,10rem);font-weight:200;letter-spacing:-.04em;transition:opacity .3s}
  .bpm span{font-size:.35em;font-weight:400;opacity:.5;vertical-align:middle;margin-left:.2em}
  .tap{width:clamp(140px,40vw,220px);height:clamp(140px,40vw,220px);border-radius:50%;border:none;background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;font-size:1.4rem;font-weight:600;letter-spacing:.05em;cursor:pointer;transition:transform .08s,box-shadow .08s;box-shadow:0 0 40px rgba(99,102,241,.3);margin-top:2.5rem;-webkit-tap-highlight-color:transparent}
  .tap:active{transform:scale(.93);box-shadow:0 0 60px rgba(139,92,246,.5)}
  .hint{margin-top:2rem;font-size:.85rem;opacity:.35;transition:opacity .5s}
  .pulse{animation:pulse .15s}
  @keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.06)}100%{transform:scale(1)}}
</style>
</head>
<body>
<div class="bpm" id="bpm">—<span>BPM</span></div>
<button class="tap" id="tap">TAP</button>
<div class="hint">tap to the beat</div>
<script>
(()=>{
  const bpmEl=document.getElementById('bpm'),btn=document.getElementById('tap');
  let taps=[],timeout;
  btn.addEventListener('pointerdown',e=>{
    e.preventDefault();
    const now=performance.now();
    clearTimeout(timeout);
    timeout=setTimeout(()=>{taps=[];bpmEl.innerHTML='—<span>BPM</span>'},2000);
    taps.push(now);
    if(taps.length>1){
      // keep last 20 taps
      if(taps.length>20)taps.shift();
      const intervals=[];
      for(let i=1;i<taps.length;i++)intervals.push(taps[i]-taps[i-1]);
      const avg=intervals.reduce((a,b)=>a+b,0)/intervals.length;
      const bpm=Math.round(60000/avg);
      bpmEl.innerHTML=bpm+'<span>BPM</span>';
    }
    bpmEl.classList.remove('pulse');
    void bpmEl.offsetWidth;
    bpmEl.classList.add('pulse');
  });
})();
</script>
</body>
</html>
