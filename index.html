<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tempo Tap</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#111;color:#eee;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh;user-select:none;-webkit-user-select:none;padding:2vh 0}
  .bpm{font-size:clamp(4rem,15vw,10rem);font-weight:200;letter-spacing:-.04em;transition:opacity .3s;margin-top:2vh}
  .bpm span{font-size:.35em;font-weight:400;opacity:.5;vertical-align:middle;margin-left:.2em}
  .tap{width:clamp(120px,30vw,180px);height:clamp(120px,30vw,180px);border-radius:50%;border:none;background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;font-size:1.4rem;font-weight:600;letter-spacing:.05em;cursor:pointer;transition:transform .08s,box-shadow .08s;box-shadow:0 0 40px rgba(99,102,241,.3);margin-top:1.5rem;-webkit-tap-highlight-color:transparent;flex-shrink:0}
  .tap:active{transform:scale(.93);box-shadow:0 0 60px rgba(139,92,246,.5)}
  .hint{margin-top:1rem;font-size:.85rem;opacity:.35;transition:opacity .5s}
  .pulse{animation:pulse .15s}
  @keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.06)}100%{transform:scale(1)}}
  .graph-container{width:min(95vw,700px);margin-top:2rem;position:relative}
  canvas#graph{width:100%;height:220px;display:block;border-radius:12px;background:#1a1a2e}
  .steady-info{margin-top:.75rem;font-size:.8rem;opacity:.5;text-align:center;min-height:1.2em}
  .identify-section{margin-top:2rem;display:flex;flex-direction:column;align-items:center;width:min(95vw,700px)}
  .identify-btn{background:linear-gradient(135deg,#10b981,#059669);color:#fff;border:none;border-radius:2rem;padding:.75rem 1.8rem;font-size:1rem;font-weight:600;cursor:pointer;transition:transform .1s,box-shadow .1s,opacity .2s;box-shadow:0 0 30px rgba(16,185,129,.25);-webkit-tap-highlight-color:transparent}
  .identify-btn:active{transform:scale(.95)}
  .identify-btn:disabled{opacity:.6;cursor:not-allowed}
  .identify-btn.listening{animation:listenPulse 1s infinite;background:linear-gradient(135deg,#f59e0b,#d97706)}
  @keyframes listenPulse{0%,100%{box-shadow:0 0 30px rgba(245,158,11,.3)}50%{box-shadow:0 0 50px rgba(245,158,11,.6)}}
  .identify-result{margin-top:1rem;padding:1rem 1.5rem;background:#1a1a2e;border-radius:12px;width:100%;display:none;align-items:center;gap:1rem}
  .identify-result.show{display:flex}
  .identify-result img{width:64px;height:64px;border-radius:8px;object-fit:cover;flex-shrink:0}
  .identify-result .info{flex:1;min-width:0}
  .identify-result .title{font-size:1.1rem;font-weight:600;color:#fff}
  .identify-result .artist{font-size:.9rem;color:#a78bfa;margin-top:.2rem}
  .identify-result .album{font-size:.8rem;opacity:.5;margin-top:.2rem}
  .identify-result .error{color:#f87171;font-size:.9rem}
  .identify-status{margin-top:.5rem;font-size:.8rem;opacity:.5;min-height:1.2em;text-align:center}
</style>
</head>
<body>
<div class="bpm" id="bpm">—<span>BPM</span></div>
<button class="tap" id="tap">TAP</button>
<div class="hint">tap to the beat</div>
<div class="graph-container">
  <canvas id="graph"></canvas>
  <div class="steady-info" id="steadyInfo"></div>
</div>
<div class="identify-section">
  <button class="identify-btn" id="identifyBtn">🎵 Identify Song</button>
  <div class="identify-status" id="identifyStatus"></div>
  <div class="identify-result" id="identifyResult">
    <img id="albumArt" src="" alt="">
    <div class="info">
      <div class="title" id="songTitle"></div>
      <div class="artist" id="songArtist"></div>
      <div class="album" id="songAlbum"></div>
    </div>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
<script>
(()=>{
  const bpmEl=document.getElementById('bpm'),btn=document.getElementById('tap'),canvas=document.getElementById('graph'),ctx=canvas.getContext('2d'),steadyInfoEl=document.getElementById('steadyInfo');

  // High-DPI canvas
  function resizeCanvas(){
    const rect=canvas.getBoundingClientRect();
    const dpr=window.devicePixelRatio||1;
    canvas.width=rect.width*dpr;
    canvas.height=rect.height*dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    canvas._w=rect.width;canvas._h=rect.height;
  }
  resizeCanvas();
  window.addEventListener('resize',resizeCanvas);

  let taps=[], timeout;
  // Each entry: {time: Date.now(), bpm: number}
  let bpmHistory=[];
  const WINDOW_SEC=40;
  const STEADY_MIN_TAPS=8;
  const STEADY_THRESHOLD=0.05; // 5% of mean

  btn.addEventListener('pointerdown',e=>{
    e.preventDefault();
    const now=performance.now();
    const wallNow=Date.now();
    clearTimeout(timeout);
    timeout=setTimeout(()=>{taps=[];bpmEl.innerHTML='—<span>BPM</span>'},2000);
    taps.push(now);
    if(taps.length>1){
      if(taps.length>40)taps.shift();
      const intervals=[];
      for(let i=1;i<taps.length;i++)intervals.push(taps[i]-taps[i-1]);
      const avg=intervals.reduce((a,b)=>a+b,0)/intervals.length;
      const bpm=Math.round(60000/avg);
      bpmEl.innerHTML=bpm+'<span>BPM</span>';
      // Instant BPM from last interval
      const instantBpm=60000/intervals[intervals.length-1];
      bpmHistory.push({time:wallNow,bpm:instantBpm});
    }
    // Trim old entries
    const cutoff=wallNow-WINDOW_SEC*1000;
    bpmHistory=bpmHistory.filter(d=>d.time>=cutoff);
    drawGraph();
    bpmEl.classList.remove('pulse');
    void bpmEl.offsetWidth;
    bpmEl.classList.add('pulse');
  });

  function findSteadyRegions(){
    const regions=[];
    if(bpmHistory.length<STEADY_MIN_TAPS)return regions;
    // Sliding window of STEADY_MIN_TAPS points
    for(let winSize=STEADY_MIN_TAPS;winSize<=bpmHistory.length;winSize++){
      // Try all windows of this size, but we'll do a simpler approach:
      // just use fixed window size = STEADY_MIN_TAPS and slide
    }
    // Simple approach: slide a window of size STEADY_MIN_TAPS
    for(let i=0;i<=bpmHistory.length-STEADY_MIN_TAPS;i++){
      const slice=bpmHistory.slice(i,i+STEADY_MIN_TAPS);
      const mean=slice.reduce((s,d)=>s+d.bpm,0)/slice.length;
      const variance=slice.reduce((s,d)=>s+(d.bpm-mean)**2,0)/slice.length;
      const std=Math.sqrt(variance);
      if(std<STEADY_THRESHOLD*mean){
        regions.push({start:i,end:i+STEADY_MIN_TAPS-1,mean:Math.round(mean),std});
      }
    }
    // Merge overlapping regions
    if(regions.length===0)return regions;
    const merged=[{...regions[0]}];
    for(let i=1;i<regions.length;i++){
      const last=merged[merged.length-1];
      if(regions[i].start<=last.end+1){
        last.end=Math.max(last.end,regions[i].end);
        // Recalc mean for merged
        const slice=bpmHistory.slice(last.start,last.end+1);
        last.mean=Math.round(slice.reduce((s,d)=>s+d.bpm,0)/slice.length);
      }else{
        merged.push({...regions[i]});
      }
    }
    return merged;
  }

  function drawGraph(){
    const w=canvas._w,h=canvas._h;
    if(!w)return;
    ctx.clearRect(0,0,w,h);

    // Background
    ctx.fillStyle='#1a1a2e';
    ctx.beginPath();
    ctx.roundRect(0,0,w,h,12);
    ctx.fill();

    if(bpmHistory.length<2){
      ctx.fillStyle='rgba(255,255,255,0.15)';
      ctx.font='14px sans-serif';
      ctx.textAlign='center';
      ctx.fillText('Start tapping to see tempo graph',w/2,h/2);
      return;
    }

    const pad={top:25,right:15,bottom:30,left:50};
    const gw=w-pad.left-pad.right, gh=h-pad.top-pad.bottom;

    // Time range
    const tMax=bpmHistory[bpmHistory.length-1].time;
    const tMin=tMax-WINDOW_SEC*1000;

    // BPM range with padding
    const bpms=bpmHistory.map(d=>d.bpm);
    let bpmMin=Math.min(...bpms)-10, bpmMax=Math.max(...bpms)+10;
    if(bpmMax-bpmMin<20){const mid=(bpmMax+bpmMin)/2;bpmMin=mid-10;bpmMax=mid+10;}

    const xOf=d=>pad.left+((d.time-tMin)/(tMax-tMin))*gw;
    const yOf=bpm=>pad.top+gh-(((bpm-bpmMin)/(bpmMax-bpmMin))*gh);

    // Steady regions - highlight
    const regions=findSteadyRegions();
    const steadyBpms=new Set();
    for(const r of regions){
      const x1=xOf(bpmHistory[r.start]);
      const x2=xOf(bpmHistory[r.end]);
      ctx.fillStyle='rgba(0,210,180,0.12)';
      ctx.fillRect(x1,pad.top,x2-x1,gh);
      // Border
      ctx.strokeStyle='rgba(0,210,180,0.3)';
      ctx.lineWidth=1;
      ctx.strokeRect(x1,pad.top,x2-x1,gh);
      steadyBpms.add(r.mean);
    }

    // Grid lines - Y axis
    ctx.strokeStyle='rgba(255,255,255,0.07)';
    ctx.lineWidth=1;
    const yStep=Math.max(5,Math.round((bpmMax-bpmMin)/5/5)*5)||10;
    const yStart=Math.ceil(bpmMin/yStep)*yStep;
    ctx.font='11px sans-serif';
    ctx.fillStyle='rgba(255,255,255,0.35)';
    ctx.textAlign='right';
    for(let v=yStart;v<=bpmMax;v+=yStep){
      const y=yOf(v);
      ctx.beginPath();ctx.moveTo(pad.left,y);ctx.lineTo(w-pad.right,y);ctx.stroke();
      ctx.fillText(v,pad.left-6,y+4);
    }

    // X axis labels (seconds ago)
    ctx.textAlign='center';
    ctx.fillStyle='rgba(255,255,255,0.3)';
    for(let s=0;s<=WINDOW_SEC;s+=10){
      const x=pad.left+((WINDOW_SEC-s)/WINDOW_SEC)*gw;
      ctx.fillText(s===0?'now':`-${s}s`,x,h-6);
      if(s>0){
        ctx.beginPath();ctx.strokeStyle='rgba(255,255,255,0.05)';ctx.moveTo(x,pad.top);ctx.lineTo(x,pad.top+gh);ctx.stroke();
      }
    }

    // BPM line
    ctx.beginPath();
    ctx.strokeStyle='#8b5cf6';
    ctx.lineWidth=2.5;
    ctx.lineJoin='round';
    ctx.lineCap='round';
    for(let i=0;i<bpmHistory.length;i++){
      const x=xOf(bpmHistory[i]),y=yOf(bpmHistory[i].bpm);
      i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
    }
    ctx.stroke();

    // Dots
    for(let i=0;i<bpmHistory.length;i++){
      const x=xOf(bpmHistory[i]),y=yOf(bpmHistory[i].bpm);
      ctx.beginPath();
      ctx.arc(x,y,3,0,Math.PI*2);
      ctx.fillStyle='#a78bfa';
      ctx.fill();
    }

    // Steady BPM horizontal lines — anchored to region bounds
    for(const r of regions){
      const x1=xOf(bpmHistory[r.start]);
      const x2=xOf(bpmHistory[r.end]);
      const y=yOf(r.mean);
      // Dashed line only across the region
      ctx.setLineDash([6,4]);
      ctx.strokeStyle='rgba(0,210,180,0.7)';
      ctx.lineWidth=1.5;
      ctx.beginPath();ctx.moveTo(x1,y);ctx.lineTo(x2,y);ctx.stroke();
      ctx.setLineDash([]);
      // Label anchored to the midpoint of the region
      const labelX=(x1+x2)/2;
      const labelY=y-8;
      const label=`${r.mean} BPM`;
      ctx.font='bold 12px sans-serif';
      const tw=ctx.measureText(label).width;
      // Background pill for readability
      ctx.fillStyle='rgba(26,26,46,0.85)';
      ctx.beginPath();
      ctx.roundRect(labelX-tw/2-6,labelY-11,tw+12,16,4);
      ctx.fill();
      // Text
      ctx.fillStyle='#00d2b4';
      ctx.textAlign='center';
      ctx.fillText(label,labelX,labelY);
    }

    // Steady info text
    if(regions.length>0){
      const vals=[...new Set(regions.map(r=>r.mean))].join(', ');
      steadyInfoEl.textContent=`Steady tempo detected: ${vals} BPM`;
      steadyInfoEl.style.color='#00d2b4';
    }else if(bpmHistory.length>=STEADY_MIN_TAPS){
      steadyInfoEl.textContent='No steady tempo region detected yet';
      steadyInfoEl.style.color='';
    }else{
      steadyInfoEl.textContent=`Need ${STEADY_MIN_TAPS-bpmHistory.length} more taps for analysis`;
      steadyInfoEl.style.color='';
    }
  }

  // Initial draw
  drawGraph();

  // --- ACRCloud Song Identification (Rolling Buffer) ---
  const ACR={host:'identify-us-west-2.acrcloud.com',key:'15ad007b1de259c2ff7c2e29d32f8f53',secret:'IWfEIQO0PV3QWW1kiJrs1S4KfIhUmkZVxJzywLuc'};
  const idBtn=document.getElementById('identifyBtn'),idStatus=document.getElementById('identifyStatus'),idResult=document.getElementById('identifyResult');
  let identifying=false;

  // Rolling buffer: keep last ~15 seconds of mic audio always recording
  const BUFFER_SECONDS=15;
  const SLICE_MS=1000; // collect 1s chunks
  let micStream=null, bufferRecorder=null, audioChunks=[], bufferReady=false;

  async function startRollingBuffer(){
    try{
      micStream=await navigator.mediaDevices.getUserMedia({
        audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}
      });
      const mimeType=MediaRecorder.isTypeSupported('audio/webm;codecs=opus')?'audio/webm;codecs=opus':'audio/webm';
      bufferRecorder=new MediaRecorder(micStream,{mimeType});
      bufferRecorder.ondataavailable=e=>{
        if(e.data.size>0){
          audioChunks.push({data:e.data,time:Date.now()});
          // Trim chunks older than BUFFER_SECONDS
          const cutoff=Date.now()-BUFFER_SECONDS*1000;
          audioChunks=audioChunks.filter(c=>c.time>=cutoff);
        }
      };
      bufferRecorder.start(SLICE_MS);
      bufferReady=true;
      idBtn.textContent='🎵 Identify Song';
      idStatus.textContent='🎤 Mic ready — play music, then tap Identify';
      idStatus.style.color='#10b981';
    }catch(e){
      if(e.name==='NotAllowedError'){
        idStatus.textContent='Mic permission denied — tap Identify to retry';
        idBtn.textContent='🎤 Enable Mic';
      }else{
        idStatus.textContent='Mic error: '+e.message;
      }
    }
  }

  // Start buffer on page load
  startRollingBuffer();

  idBtn.addEventListener('click',async()=>{
    if(identifying)return;
    // If mic not ready yet, try to start it
    if(!bufferReady){
      await startRollingBuffer();
      if(!bufferReady)return;
      return; // Just started mic — let it buffer a few seconds first
    }
    if(audioChunks.length<3){
      idStatus.textContent='Need a few more seconds of audio…';
      idStatus.style.color='#f59e0b';
      return;
    }
    identifying=true;
    idBtn.disabled=true;
    idBtn.textContent='🔍 Identifying…';
    idStatus.textContent='Sending audio to ACRCloud…';
    idStatus.style.color='';
    idResult.classList.remove('show');
    try{
      // Grab last ~10 seconds from the rolling buffer
      const cutoff=Date.now()-10000;
      const recent=audioChunks.filter(c=>c.time>=cutoff);
      const blob=new Blob(recent.map(c=>c.data),{type:bufferRecorder.mimeType});
      const result=await identifySong(blob);
      showResult(result);
    }catch(e){
      idResult.classList.add('show');
      idResult.innerHTML='<div class="error">Error: '+e.message+'</div>';
      idStatus.textContent='';
    }finally{
      identifying=false;
      idBtn.disabled=false;
      idBtn.textContent='🎵 Identify Song';
      if(bufferReady){
        idStatus.textContent='🎤 Mic ready — play music, then tap Identify';
        idStatus.style.color='#10b981';
      }
    }
  });

  async function identifySong(blob){
    const timestamp=Math.floor(Date.now()/1000);
    const stringToSign=`POST\n/v1/identify\n${ACR.key}\naudio\n1\n${timestamp}`;
    const signature=CryptoJS.enc.Base64.stringify(CryptoJS.HmacSHA1(stringToSign,ACR.secret));
    const form=new FormData();
    form.append('sample',blob,'sample.webm');
    form.append('sample_bytes',blob.size);
    form.append('access_key',ACR.key);
    form.append('data_type','audio');
    form.append('signature_version','1');
    form.append('signature',signature);
    form.append('timestamp',timestamp);
    const res=await fetch(`https://${ACR.host}/v1/identify`,{method:'POST',body:form});
    return res.json();
  }

  function showResult(data){
    idResult.innerHTML='<img id="albumArt" src="" alt=""><div class="info"><div class="title" id="songTitle"></div><div class="artist" id="songArtist"></div><div class="album" id="songAlbum"></div></div>';
    const art=idResult.querySelector('#albumArt'),ti=idResult.querySelector('#songTitle'),ar=idResult.querySelector('#songArtist'),al=idResult.querySelector('#songAlbum');
    if(data.status&&data.status.code===0&&data.metadata&&data.metadata.music&&data.metadata.music.length>0){
      const m=data.metadata.music[0];
      ti.textContent=m.title||'Unknown Title';
      ar.textContent=m.artists?m.artists.map(a=>a.name).join(', '):'Unknown Artist';
      al.textContent=m.album?m.album.name:'';
      // Album art from Spotify/Deezer external metadata
      let artUrl='';
      if(m.external_metadata){
        if(m.external_metadata.spotify&&m.external_metadata.spotify.album&&m.external_metadata.spotify.album.id){
          // No direct image URL from ACR, hide art
        }
        if(m.external_metadata.deezer&&m.external_metadata.deezer.album&&m.external_metadata.deezer.album.id){
          artUrl=`https://e-cdns-images.dzcdn.net/images/cover/${m.external_metadata.deezer.album.id}/264x264.jpg`;
        }
      }
      if(artUrl){art.src=artUrl;art.style.display='block'}else{art.style.display='none'}
      idStatus.textContent='';
    }else{
      art.style.display='none';
      ti.textContent='';ar.textContent='';al.textContent='';
      const msg=data.status?data.status.msg:'Unknown error';
      idResult.innerHTML='<div class="error">❌ '+(data.status&&data.status.code===1001?'No match found — try with louder/clearer audio':msg)+'</div>';
      idStatus.textContent='';
    }
    idResult.classList.add('show');
  }
})();
</script>
</body>
</html>
