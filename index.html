<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tempo Tap</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#111;color:#eee;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh;user-select:none;-webkit-user-select:none;padding:2vh 0}
  .bpm{font-size:clamp(4rem,15vw,10rem);font-weight:200;letter-spacing:-.04em;transition:opacity .3s;margin-top:2vh}
  .bpm span{font-size:.35em;font-weight:400;opacity:.5;vertical-align:middle;margin-left:.2em}
  .tap{width:clamp(120px,30vw,180px);height:clamp(120px,30vw,180px);border-radius:50%;border:none;background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;font-size:1.4rem;font-weight:600;letter-spacing:.05em;cursor:pointer;transition:transform .08s,box-shadow .08s;box-shadow:0 0 40px rgba(99,102,241,.3);margin-top:1.5rem;-webkit-tap-highlight-color:transparent;flex-shrink:0}
  .tap:active{transform:scale(.93);box-shadow:0 0 60px rgba(139,92,246,.5)}
  .hint{margin-top:1rem;font-size:.85rem;opacity:.35;transition:opacity .5s}
  .pulse{animation:pulse .15s}
  @keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.06)}100%{transform:scale(1)}}
  .graph-container{width:min(95vw,700px);margin-top:2rem;position:relative}
  canvas#graph{width:100%;height:220px;display:block;border-radius:12px;background:#1a1a2e}
  .steady-info{margin-top:.75rem;font-size:.8rem;opacity:.5;text-align:center;min-height:1.2em}
  .shazam-link{display:inline-flex;align-items:center;gap:.5rem;margin-top:2rem;padding:.65rem 1.6rem;background:linear-gradient(135deg,#0af,#06f);color:#fff;text-decoration:none;border-radius:2rem;font-size:.95rem;font-weight:600;transition:transform .1s,box-shadow .1s;box-shadow:0 0 25px rgba(0,170,255,.25);-webkit-tap-highlight-color:transparent}
  .shazam-link:active{transform:scale(.95)}
  .shazam-link svg{width:20px;height:20px;fill:currentColor}
</style>
</head>
<body>
<div class="bpm" id="bpm">—<span>BPM</span></div>
<button class="tap" id="tap">TAP</button>
<div class="hint">tap to the beat</div>
<div class="graph-container">
  <canvas id="graph"></canvas>
  <div class="steady-info" id="steadyInfo"></div>
</div>
<a class="shazam-link" href="https://www.shazam.com/recognise" target="_blank" id="shazamLink">🎵 Identify with Shazam</a>
<script>
(function(){var a=document.getElementById('shazamLink');var ios=/iPhone|iPad|iPod/i.test(navigator.userAgent);var android=/Android/i.test(navigator.userAgent);if(ios){a.href='https://apps.apple.com/app/shazam/id284993459'}else if(android){a.href='intent://shazam.com/#Intent;package=com.shazam.android;scheme=https;end'}})();
</script>
<script>
(()=>{
  const bpmEl=document.getElementById('bpm'),btn=document.getElementById('tap'),canvas=document.getElementById('graph'),ctx=canvas.getContext('2d'),steadyInfoEl=document.getElementById('steadyInfo');

  // High-DPI canvas
  function resizeCanvas(){
    const rect=canvas.getBoundingClientRect();
    const dpr=window.devicePixelRatio||1;
    canvas.width=rect.width*dpr;
    canvas.height=rect.height*dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    canvas._w=rect.width;canvas._h=rect.height;
  }
  resizeCanvas();
  window.addEventListener('resize',resizeCanvas);

  let taps=[], timeout;
  let bpmHistory=[];
  const WINDOW_SEC=40;
  const STEADY_MIN_TAPS=8;
  const STEADY_THRESHOLD=0.05;

  btn.addEventListener('pointerdown',e=>{
    e.preventDefault();
    const now=performance.now();
    const wallNow=Date.now();
    clearTimeout(timeout);
    timeout=setTimeout(()=>{taps=[];bpmEl.innerHTML='—<span>BPM</span>'},2000);
    taps.push(now);
    if(taps.length>1){
      if(taps.length>40)taps.shift();
      const intervals=[];
      for(let i=1;i<taps.length;i++)intervals.push(taps[i]-taps[i-1]);
      const avg=intervals.reduce((a,b)=>a+b,0)/intervals.length;
      const bpm=Math.round(60000/avg);
      bpmEl.innerHTML=bpm+'<span>BPM</span>';
      const instantBpm=60000/intervals[intervals.length-1];
      bpmHistory.push({time:wallNow,bpm:instantBpm});
    }
    const cutoff=wallNow-WINDOW_SEC*1000;
    bpmHistory=bpmHistory.filter(d=>d.time>=cutoff);
    drawGraph();
    bpmEl.classList.remove('pulse');
    void bpmEl.offsetWidth;
    bpmEl.classList.add('pulse');
  });

  function findSteadyRegions(){
    const regions=[];
    if(bpmHistory.length<STEADY_MIN_TAPS)return regions;
    for(let i=0;i<=bpmHistory.length-STEADY_MIN_TAPS;i++){
      const slice=bpmHistory.slice(i,i+STEADY_MIN_TAPS);
      const mean=slice.reduce((s,d)=>s+d.bpm,0)/slice.length;
      const variance=slice.reduce((s,d)=>s+(d.bpm-mean)**2,0)/slice.length;
      const std=Math.sqrt(variance);
      if(std<STEADY_THRESHOLD*mean){
        regions.push({start:i,end:i+STEADY_MIN_TAPS-1,mean:Math.round(mean),std});
      }
    }
    if(regions.length===0)return regions;
    const merged=[{...regions[0]}];
    for(let i=1;i<regions.length;i++){
      const last=merged[merged.length-1];
      if(regions[i].start<=last.end+1){
        last.end=Math.max(last.end,regions[i].end);
        const slice=bpmHistory.slice(last.start,last.end+1);
        last.mean=Math.round(slice.reduce((s,d)=>s+d.bpm,0)/slice.length);
      }else{
        merged.push({...regions[i]});
      }
    }
    return merged;
  }

  function drawGraph(){
    const w=canvas._w,h=canvas._h;
    if(!w)return;
    ctx.clearRect(0,0,w,h);

    ctx.fillStyle='#1a1a2e';
    ctx.beginPath();
    ctx.roundRect(0,0,w,h,12);
    ctx.fill();

    if(bpmHistory.length<2){
      ctx.fillStyle='rgba(255,255,255,0.15)';
      ctx.font='14px sans-serif';
      ctx.textAlign='center';
      ctx.fillText('Start tapping to see tempo graph',w/2,h/2);
      return;
    }

    const pad={top:25,right:15,bottom:30,left:50};
    const gw=w-pad.left-pad.right, gh=h-pad.top-pad.bottom;

    const tMax=bpmHistory[bpmHistory.length-1].time;
    const tMin=tMax-WINDOW_SEC*1000;

    const bpms=bpmHistory.map(d=>d.bpm);
    let bpmMin=Math.min(...bpms)-10, bpmMax=Math.max(...bpms)+10;
    if(bpmMax-bpmMin<20){const mid=(bpmMax+bpmMin)/2;bpmMin=mid-10;bpmMax=mid+10;}

    const xOf=d=>pad.left+((d.time-tMin)/(tMax-tMin))*gw;
    const yOf=bpm=>pad.top+gh-(((bpm-bpmMin)/(bpmMax-bpmMin))*gh);

    // Steady regions - highlight
    const regions=findSteadyRegions();
    for(const r of regions){
      const x1=xOf(bpmHistory[r.start]);
      const x2=xOf(bpmHistory[r.end]);
      ctx.fillStyle='rgba(0,210,180,0.12)';
      ctx.fillRect(x1,pad.top,x2-x1,gh);
      ctx.strokeStyle='rgba(0,210,180,0.3)';
      ctx.lineWidth=1;
      ctx.strokeRect(x1,pad.top,x2-x1,gh);
    }

    // Grid lines - Y axis
    ctx.strokeStyle='rgba(255,255,255,0.07)';
    ctx.lineWidth=1;
    const yStep=Math.max(5,Math.round((bpmMax-bpmMin)/5/5)*5)||10;
    const yStart=Math.ceil(bpmMin/yStep)*yStep;
    ctx.font='11px sans-serif';
    ctx.fillStyle='rgba(255,255,255,0.35)';
    ctx.textAlign='right';
    for(let v=yStart;v<=bpmMax;v+=yStep){
      const y=yOf(v);
      ctx.beginPath();ctx.moveTo(pad.left,y);ctx.lineTo(w-pad.right,y);ctx.stroke();
      ctx.fillText(v,pad.left-6,y+4);
    }

    // X axis labels
    ctx.textAlign='center';
    ctx.fillStyle='rgba(255,255,255,0.3)';
    for(let s=0;s<=WINDOW_SEC;s+=10){
      const x=pad.left+((WINDOW_SEC-s)/WINDOW_SEC)*gw;
      ctx.fillText(s===0?'now':`-${s}s`,x,h-6);
      if(s>0){
        ctx.beginPath();ctx.strokeStyle='rgba(255,255,255,0.05)';ctx.moveTo(x,pad.top);ctx.lineTo(x,pad.top+gh);ctx.stroke();
      }
    }

    // BPM line
    ctx.beginPath();
    ctx.strokeStyle='#8b5cf6';
    ctx.lineWidth=2.5;
    ctx.lineJoin='round';
    ctx.lineCap='round';
    for(let i=0;i<bpmHistory.length;i++){
      const x=xOf(bpmHistory[i]),y=yOf(bpmHistory[i].bpm);
      i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
    }
    ctx.stroke();

    // Dots
    for(let i=0;i<bpmHistory.length;i++){
      const x=xOf(bpmHistory[i]),y=yOf(bpmHistory[i].bpm);
      ctx.beginPath();
      ctx.arc(x,y,3,0,Math.PI*2);
      ctx.fillStyle='#a78bfa';
      ctx.fill();
    }

    // Steady BPM horizontal lines — anchored to region bounds
    for(const r of regions){
      const x1=xOf(bpmHistory[r.start]);
      const x2=xOf(bpmHistory[r.end]);
      const y=yOf(r.mean);
      ctx.setLineDash([6,4]);
      ctx.strokeStyle='rgba(0,210,180,0.7)';
      ctx.lineWidth=1.5;
      ctx.beginPath();ctx.moveTo(x1,y);ctx.lineTo(x2,y);ctx.stroke();
      ctx.setLineDash([]);
      const labelX=(x1+x2)/2;
      const labelY=y-8;
      const label=`${r.mean} BPM`;
      ctx.font='bold 12px sans-serif';
      const tw=ctx.measureText(label).width;
      ctx.fillStyle='rgba(26,26,46,0.85)';
      ctx.beginPath();
      ctx.roundRect(labelX-tw/2-6,labelY-11,tw+12,16,4);
      ctx.fill();
      ctx.fillStyle='#00d2b4';
      ctx.textAlign='center';
      ctx.fillText(label,labelX,labelY);
    }

    // Steady info text
    if(regions.length>0){
      const vals=[...new Set(regions.map(r=>r.mean))].join(', ');
      steadyInfoEl.textContent=`Steady tempo detected: ${vals} BPM`;
      steadyInfoEl.style.color='#00d2b4';
    }else if(bpmHistory.length>=STEADY_MIN_TAPS){
      steadyInfoEl.textContent='No steady tempo region detected yet';
      steadyInfoEl.style.color='';
    }else{
      steadyInfoEl.textContent=`Need ${STEADY_MIN_TAPS-bpmHistory.length} more taps for analysis`;
      steadyInfoEl.style.color='';
    }
  }

  drawGraph();
})();
</script>
</body>
</html>
